name: Release Build

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
    branches:
      - '26.x_unified'
  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v26.5.4)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEJOBS: '-j4'
  PROJECT_NAME: 'BitcoinPoW'

jobs:
  # ============================================================
  # Linux x86_64 — native build on Ubuntu
  # ============================================================
  linux-x86_64:
    name: 'Linux x86_64'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl ca-certificates ccache python3 \
            libevent-dev libboost-dev libsqlite3-dev libdb++-dev \
            libminiupnpc-dev libnatpmp-dev libzmq3-dev \
            libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev \
            qttools5-dev-tools qtwayland5 libqrencode-dev

      - name: Set Ccache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"

      - name: Restore Ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-x86_64-ccache-${{ github.run_id }}
          restore-keys: linux-x86_64-ccache-

      - name: Build
        run: |
          ./autogen.sh
          ./configure --with-gui=yes \
                      --enable-reduce-exports \
                      --disable-bench \
                      --disable-tests \
                      --disable-gui-tests \
                      --disable-fuzz-binary
          make ${{ env.MAKEJOBS }}

      - name: Create package
        run: |
          DISTNAME="${{ env.PROJECT_NAME }}-${{ github.ref_name }}-x86_64-linux-gnu"
          mkdir -p "${DISTNAME}/bin"
          strip src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet src/qt/bitcoin-qt 2>/dev/null || true
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet "${DISTNAME}/bin/" 2>/dev/null || true
          cp src/qt/bitcoin-qt "${DISTNAME}/bin/" 2>/dev/null || true
          cp README.md COPYING "${DISTNAME}/" 2>/dev/null || true
          cp share/examples/bitcoin.conf "${DISTNAME}/" 2>/dev/null || true
          tar czf "${DISTNAME}.tar.gz" "${DISTNAME}"
          sha256sum "${DISTNAME}.tar.gz" > "${DISTNAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ env.PROJECT_NAME }}-*-x86_64-linux-gnu.tar.gz
            ${{ env.PROJECT_NAME }}-*-x86_64-linux-gnu.tar.gz.sha256

      - name: Save Ccache cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-x86_64-ccache-${{ github.run_id }}

  # ============================================================
  # Windows x64 — cross-compiled from Linux using mingw-w64
  # ============================================================
  windows-x64:
    name: 'Windows x64'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake cmake pkg-config \
            bsdmainutils curl ca-certificates ccache python3 python3-setuptools \
            g++-mingw-w64-x86-64-posix nsis zip bison

      - name: Set Ccache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"

      - name: Restore Ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-x64-ccache-${{ github.run_id }}
          restore-keys: windows-x64-ccache-

      - name: Restore depends cache
        uses: actions/cache/restore@v4
        with:
          path: depends/built
          key: windows-x64-depends-${{ hashFiles('depends/packages/*.mk') }}
          restore-keys: windows-x64-depends-

      - name: Build depends
        run: |
          make -C depends HOST=x86_64-w64-mingw32 ${{ env.MAKEJOBS }}

      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
          ./configure --prefix=/ \
                      --enable-reduce-exports \
                      --disable-bench \
                      --disable-tests \
                      --disable-gui-tests \
                      --disable-fuzz-binary
          make ${{ env.MAKEJOBS }}

      - name: Create package
        run: |
          DISTNAME="${{ env.PROJECT_NAME }}-${{ github.ref_name }}-win64"
          mkdir -p "${DISTNAME}"
          cp src/bitcoind.exe src/bitcoin-cli.exe src/bitcoin-tx.exe src/bitcoin-util.exe src/bitcoin-wallet.exe "${DISTNAME}/" 2>/dev/null || true
          cp src/qt/bitcoin-qt.exe "${DISTNAME}/" 2>/dev/null || true
          cp README.md COPYING "${DISTNAME}/" 2>/dev/null || true
          cp share/examples/bitcoin.conf "${DISTNAME}/" 2>/dev/null || true
          zip -r "${DISTNAME}.zip" "${DISTNAME}"
          sha256sum "${DISTNAME}.zip" > "${DISTNAME}.zip.sha256"

      - name: Create installer
        continue-on-error: true
        run: |
          make deploy BITCOIN_WIN_INSTALLER="${{ env.PROJECT_NAME }}-${{ github.ref_name }}-win64-setup.exe" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            ${{ env.PROJECT_NAME }}-*-win64.zip
            ${{ env.PROJECT_NAME }}-*-win64.zip.sha256
            ${{ env.PROJECT_NAME }}-*-win64-setup.exe

      - name: Save depends cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: depends/built
          key: windows-x64-depends-${{ hashFiles('depends/packages/*.mk') }}

      - name: Save Ccache cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-x64-ccache-${{ github.run_id }}

  # ============================================================
  # macOS ARM64 (Apple Silicon) — native build on M1 runner
  # ============================================================
  macos-arm64:
    name: 'macOS ARM64 (Apple Silicon)'
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install automake libtool pkg-config gnu-getopt ccache \
               boost libevent miniupnpc libnatpmp zeromq qt@5 qrencode

      - name: Set Ccache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"

      - name: Restore Ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-arm64-ccache-${{ github.run_id }}
          restore-keys: macos-arm64-ccache-

      - name: Build
        run: |
          ./autogen.sh
          ./configure --with-gui=yes \
                      --enable-reduce-exports \
                      --disable-bench \
                      --disable-tests \
                      --disable-gui-tests \
                      --disable-fuzz-binary
          make ${{ env.MAKEJOBS }}

      - name: Create package
        run: |
          make deploy || true
          DISTNAME="${{ env.PROJECT_NAME }}-${{ github.ref_name }}-arm64-apple-darwin"
          mkdir -p "${DISTNAME}/bin"
          cp src/bitcoind src/bitcoin-cli src/bitcoin-tx src/bitcoin-util src/bitcoin-wallet "${DISTNAME}/bin/" 2>/dev/null || true
          cp src/qt/bitcoin-qt "${DISTNAME}/bin/" 2>/dev/null || true
          cp README.md COPYING "${DISTNAME}/" 2>/dev/null || true
          cp share/examples/bitcoin.conf "${DISTNAME}/" 2>/dev/null || true
          cp -r Bitcoin-Core.app "${DISTNAME}/" 2>/dev/null || true
          cp Bitcoin-Core.zip "${DISTNAME}/" 2>/dev/null || true
          tar czf "${DISTNAME}.tar.gz" "${DISTNAME}"
          shasum -a 256 "${DISTNAME}.tar.gz" > "${DISTNAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            ${{ env.PROJECT_NAME }}-*-arm64-apple-darwin.tar.gz
            ${{ env.PROJECT_NAME }}-*-arm64-apple-darwin.tar.gz.sha256

      - name: Save Ccache cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-arm64-ccache-${{ github.run_id }}

  # ============================================================
  # Create GitHub Release with all platform binaries
  # ============================================================
  create-release:
    name: 'Create GitHub Release'
    needs: [linux-x86_64, windows-x64, macos-arm64]
    runs-on: ubuntu-22.04
    # Only create a release on tag pushes or manual dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: |
          echo "=== Release artifacts ==="
          find release-artifacts -type f | sort
          echo "========================="

      - name: Generate SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum *.tar.gz *.zip *.exe 2>/dev/null | sort -k2 > SHA256SUMS || true
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v26.5.4-$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Bitcoin PoW ${{ steps.tag.outputs.tag }}"
          body: |
            ## Bitcoin PoW ${{ steps.tag.outputs.tag }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | 🐧 Linux x86_64 | `${{ env.PROJECT_NAME }}-${{ steps.tag.outputs.tag }}-x86_64-linux-gnu.tar.gz` |
            | 🪟 Windows x64 | `${{ env.PROJECT_NAME }}-${{ steps.tag.outputs.tag }}-win64.zip` |
            | 🍎 macOS Apple Silicon | `${{ env.PROJECT_NAME }}-${{ steps.tag.outputs.tag }}-arm64-apple-darwin.tar.gz` |

            ### Verify Downloads
            Check the `SHA256SUMS` file to verify the integrity of your download.

            ---
            https://www.bitcoin-pow.org
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
